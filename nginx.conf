events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;

  server {
    listen 80;
    root  /usr/share/nginx/html;
    index index.html;

    # HTTP Basic Auth — prompts for username/password before serving anything
    auth_basic           "CryptoSignal — Restricted Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Prevent browsers from caching stale app files after deployments
    add_header Cache-Control "no-cache, must-revalidate" always;

    # Security headers
    add_header X-Frame-Options        "DENY"        always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "no-referrer" always;
    add_header Permissions-Policy     "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' https://assets.mixkit.co; connect-src 'self' https://api.binance.com https://fapi.binance.com https://stream.binance.com wss://stream.binance.com:* https://api.alternative.me https://api.coingecko.com https://api.telegram.org;" always;

    location / {
      try_files $uri $uri/ /index.html;
    }

    # Logout endpoint — visiting /logout clears Chrome's cached Basic Auth credentials
    location = /logout {
      auth_basic off;
      add_header Cache-Control "no-store" always;
      return 401 "Logged out. Close this tab and reopen the app to log in again.";
      add_header WWW-Authenticate 'Basic realm="CryptoSignal — Restricted Access"' always;
      add_header Content-Type "text/plain" always;
    }
  }
}
